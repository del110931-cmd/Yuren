      const [answers, setAnswers] = useState({});
      const dmScriptUrl = "https://script.google.com/macros/s/AKfycbwymWf9Jfk0ZbI9EFhte6yyne-LKbze-aF0QH-T7Wzq_pom7p_CVh137qWrob_3oORUew/exec";
      const [submitStatus, setSubmitStatus] = useState("idle"); 

      // ====== 音樂播放控制設定 ======
      const audioRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(false);
      
      // 網易雲音樂連結
      const BGM_URL = "https://music.163.com/song/media/outer/url?id=2707413193.mp3";

      const toggleMusic = () => {
        if (audioRef.current) {
          if (isPlaying) {
            audioRef.current.pause();
            setIsPlaying(false);
          } else {
            if (audioRef.current.readyState === 0) {
              audioRef.current.load();
            }
            audioRef.current.volume = 1.0; 
            audioRef.current.play()
              .then(() => setIsPlaying(true))
              .catch(e => console.log("播放被阻擋", e));
          }
        }
      };

      const playMusicOnStart = () => {
        if (audioRef.current && !isPlaying) {
          if (audioRef.current.readyState === 0) {
            audioRef.current.load();
          }
          audioRef.current.volume = 1.0; 
          const playPromise = audioRef.current.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              setIsPlaying(true);
            }).catch(e => {
              console.log("手機瀏覽器嚴格阻擋自動播放，需等待使用者手動點擊浮動按鈕", e);
              setIsPlaying(false);
            });
          }
        }
      };
      // ==============================

      const baseQuestions = gender === 'female' ? femaleQuestions : maleQuestions;
      const questions = gender ? [
        { id: 'name', text: "請問您的靈魂稱呼？", type: "text", placeholder: "請輸入您的暱稱" },
        { id: 'playTime', text: "星象顯示您預計何時開啟這段旅程？", type: "text", placeholder: "例如：2026/03/01 下午 2:00 或 尚未確定" },
        ...baseQuestions,
        { id: 'comment', text: "命運之輪轉動前，還有什麼想補充的嗎？", type: "text", placeholder: "若無則免填" }
      ] : [];

      const charactersList = gender === 'female' ? ['洛小小', '海拉', 'C'] : ['江予川', '林弋', '犬七'];

      const characterImages = {
        '洛小小': 'https://i.postimg.cc/yYk0LH2y/mmexport1771836054532.jpg',
        '海拉': 'https://i.postimg.cc/Pf1gNgSr/mmexport1771836050887.jpg',
        'C': 'https://i.postimg.cc/VL6W2M0J/mmexport1771836052807.jpg',
        '江予川': 'https://i.postimg.cc/Fz2zP2JZ/mmexport1771836068506.jpg',
        '林弋': 'https://i.postimg.cc/QMs9ZGYm/mmexport1771836066733.jpg',
        '犬七': 'https://i.postimg.cc/GtN8W46b/mmexport1771836064914.jpg' 
      };

      const handleStart = (selectedGender) => {
        setGender(selectedGender);
        setCurrentStep(0);
        setAnswers({});
        setSubmitStatus("idle");
        playMusicOnStart();
      };

      const handleOptionToggle = (questionId, optionIndex, isMulti) => {
        setAnswers(prev => {
          const currentSelections = prev[questionId] || [];
          if (isMulti) {
            if (currentSelections.includes(optionIndex)) {
              return { ...prev, [questionId]: currentSelections.filter(idx => idx !== optionIndex) };
            } else {
              return { ...prev, [questionId]: [...currentSelections, optionIndex] };
            }
          } else {
            return { ...prev, [questionId]: [optionIndex] };
          }
        });
      };

      const handleTextChange = (questionId, value) => {
        setAnswers(prev => ({ ...prev, [questionId]: value }));
      };

      const handleNext = () => setCurrentStep(prev => prev + 1);
      const handlePrev = () => setCurrentStep(prev => prev - 1);

      const calculateResults = () => {
        let results = {};
        charactersList.forEach(char => {
          results[char] = { positive: 0, negative: 0 };
        });

        questions.forEach(q => {
          if (q.type === 'text') return;
          const selectedIndices = answers[q.id] || [];
          selectedIndices.forEach(idx => {
            const optionScores = q.options[idx].scores;
            for (const [char, score] of Object.entries(optionScores)) {
              if (results[char]) {
                if (score > 0) results[char].positive += score;
                if (score < 0) results[char].negative += score;
              }
            }
          });
        });

        const sortedCharacters = charactersList.map(char => ({
          name: char,
          positive: results[char].positive,
          negative: results[char].negative
        })).sort((a, b) => {
          const penaltyA = Math.abs(a.negative);
          const penaltyB = Math.abs(b.negative);
          if (penaltyA !== penaltyB) return penaltyA - penaltyB;
          return b.positive - a.positive;
        });

        return sortedCharacters;
      };

      const getSelectionsString = () => {
        let str = [];
        questions.forEach(q => {
          if (q.type === 'text') return;
          const selectedIndices = answers[q.id] || [];
          if (selectedIndices.length > 0) {
            const selectedLetters = selectedIndices.map(idx => String.fromCharCode(65 + idx)).join(', ');
            str.push(`第${q.id}題:${selectedLetters}`);
          }
        });
        return str.join(' | ');
      };

      const handleSubmitToSheet = async () => {
        setSubmitStatus("loading");
        const finalResults = calculateResults();

        const payload = {
          name: answers['name'] || '未提供',
          playTime: answers['playTime'] || '未提供',
          version: gender === 'female' ? '女生版' : '男生版',
          rank1: `${finalResults[0].name} (匹配度: ${finalResults[0].positive}, 雷點: ${finalResults[0].negative})`,
          rank2: `${finalResults[1].name} (匹配度: ${finalResults[1].positive}, 雷點: ${finalResults[1].negative})`,
          rank3: `${finalResults[2].name} (匹配度: ${finalResults[2].positive}, 雷點: ${finalResults[2].negative})`,
          selections: getSelectionsString(),
          comment: answers['comment'] || '無'
        };

        try {
          await fetch(dmScriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSubmitStatus("success");
        } catch (err) {
          setSubmitStatus("error");
        }
      };

      const resetTest = () => {
        setGender(null);
        setCurrentStep(-1);
        setAnswers({});
        setSubmitStatus("idle");
      };

      const AtmosphereBackground = () => (
        <div className="fixed inset-0 z-0 pointer-events-none bg-[#090b14] overflow-hidden">
          <div className="absolute top-[-20%] left-[-10%] w-[60vw] h-[60vw] bg-indigo-900/30 rounded-full blur-[120px]"></div>
          <div className="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] bg-amber-700/20 rounded-full blur-[140px]"></div>
          <div className="absolute top-[30%] right-[10%] w-[40vw] h-[40vw] bg-purple-900/10 rounded-full blur-[120px]"></div>
          <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-40 mix-blend-overlay"></div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 relative font-sans text-amber-50/90 selection:bg-amber-700/50">
          
          <audio ref={audioRef} src={BGM_URL} loop playsInline />

          <div className="fixed z-50 bottom-6 right-6 flex flex-col items-end gap-3">
            {!isPlaying && (
              <div className="bg-[#05060a]/90 text-amber-400 text-xs px-4 py-2 rounded-lg border border-amber-700/80 backdrop-blur-md animate-bounce shadow-[0_0_15px_rgba(217,119,6,0.3)] tracking-wider">
                點擊開啟音樂 (iPhone請關閉靜音鍵) ▼
              </div>
            )}
            <button 
              onClick={toggleMusic}
              className={`p-4 rounded-full shadow-[0_0_20px_rgba(0,0,0,0.8)] border-2 transition-all duration-300 backdrop-blur-xl ${
                isPlaying 
                  ? 'bg-amber-900/40 border-amber-500/60 text-amber-300 hover:bg-amber-800/60' 
                  : 'bg-slate-900/80 border-amber-600/80 text-amber-500 hover:text-amber-200 shadow-[0_0_15px_rgba(217,119,6,0.5)]'
              }`}
              title="切換背景音樂"
            >
              {isPlaying ? (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M9 18V5l12-2v13"></path>
                  <circle cx="6" cy="18" r="3"></circle>
                  <circle cx="18" cy="16" r="3"></circle>
                </svg>
              ) : (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" className="ml-1">
                  <path d="M5 3l14 9-14 9V3z"></path>
                </svg>
              )}
            </button>
          </div>

          <AtmosphereBackground />

          {currentStep === -1 && (
            <div className="relative z-10 bg-[#0d111d]/80 backdrop-blur-xl border border-amber-900/50 p-10 rounded-xl shadow-[0_0_50px_rgba(0,0,0,0.8)] max-w-lg w-full text-center">
              <div className="absolute top-3 left-3 w-1.5 h-1.5 bg-amber-600/60 rounded-full"></div>
              <div className="absolute top-3 right-3 w-1.5 h-1.5 bg-amber-600/60 rounded-full"></div>
              <div className="absolute bottom-3 left-3 w-1.5 h-1.5 bg-amber-600/60 rounded-full"></div>
              <div className="absolute bottom-3 right-3 w-1.5 h-1.5 bg-amber-600/60 rounded-full"></div>

              <div className="mb-3 tracking-[0.4em] text-xs font-bold text-amber-500/80 uppercase flex items-center justify-center gap-2">
                <span>✦</span> The Major Arcana <span>✦</span>
              </div>
              <h1 className="text-4xl md:text-5xl font-black mb-4 tracking-widest text-transparent bg-clip-text bg-gradient-to-b from-amber-100 via-amber-300 to-amber-600 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]" style={{ fontFamily: '"Playfair Display", "Noto Serif TC", serif' }}>
                《愚人對白》
              </h1>
              
              <div className="flex items-center justify-center gap-3 mx-auto mb-6 opacity-70">
                <div className="h-px w-12 bg-gradient-to-r from-transparent to-amber-500"></div>
                <span className="text-amber-500 text-lg">✧</span>
                <div className="h-px w-12 bg-gradient-to-l from-transparent to-amber-500"></div>
              </div>
              
              <h2 className="text-lg text-amber-100/80 mb-6 font-medium tracking-[0.2em]" style={{ fontFamily: '"Noto Serif TC", serif' }}>
                靈魂宿命占卜
              </h2>
              <p className="text-indigo-200/70 mb-10 text-sm leading-relaxed text-left font-light border-l-2 border-amber-900/50 pl-4">
                歡迎諸位體驗愚人對白的故事，本故事屬於一個架空背景，神運者出現，伴隨著專屬阿卡納牌的甦醒而擁有着改變世界的能力。<br/><br/>
                在這個世界一切皆有可能發生，「愚者」已準備就緒。請翻開您的命運之牌，準備好開啟這段旅程了嗎？
              </p>
              
              <div className="flex flex-col sm:flex-row gap-5 justify-center">
                <button
                  onClick={() => handleStart('female')}
                  className="relative group overflow-hidden bg-[#0a0d16] border border-amber-700/40 hover:border-amber-400 text-amber-50 font-medium py-3 px-6 rounded-lg transition-all duration-500 shadow-lg"
                >
                  <div className="absolute inset-0 w-full h-full bg-gradient-to-b from-amber-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                  <span className="relative z-10 tracking-widest" style={{ fontFamily: '"Noto Serif TC", serif' }}>星月之徑</span>
                  <span className="relative z-10 block text-[10px] text-amber-500/60 group-hover:text-amber-300 transition-colors mt-1 tracking-wider">女生路線 ✦ 洛小小 / 海拉 / C</span>
                </button>
                <button
                  onClick={() => handleStart('male')}
                  className="relative group overflow-hidden bg-[#0a0d16] border border-amber-700/40 hover:border-amber-400 text-amber-50 font-medium py-3 px-6 rounded-lg transition-all duration-500 shadow-lg"
                >
                  <div className="absolute inset-0 w-full h-full bg-gradient-to-b from-indigo-900/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                  <span className="relative z-10 tracking-widest" style={{ fontFamily: '"Noto Serif TC", serif' }}>烈陽之徑</span>
                  <span className="relative z-10 block text-[10px] text-indigo-400/60 group-hover:text-indigo-300 transition-colors mt-1 tracking-wider">男生路線 ✦ 江予川 / 林弋 / 犬七</span>
                </button>
              </div>
            </div>
          )}

          {(currentStep >= 0 && currentStep < questions.length) && (
            <div className="relative z-10 bg-[#0d111d]/85 backdrop-blur-xl border border-amber-900/40 p-8 md:p-10 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] max-w-2xl w-full">
              <div className="absolute top-2 left-2 w-1 h-1 bg-amber-700/60 rounded-full"></div>
              <div className="absolute top-2 right-2 w-1 h-1 bg-amber-700/60 rounded-full"></div>
              
              <div className="flex justify-between items-center mb-10 border-b border-amber-900/30 pb-4">
                <div className="flex flex-col gap-2 w-full max-w-[150px]">
                  <span className="text-[10px] font-bold tracking-[0.2em] text-amber-500/80 uppercase">The Oracle {currentStep + 1}</span>
                  <div className="h-0.5 w-full bg-slate-800 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-amber-700 to-amber-400 transition-all duration-700 ease-in-out" style={{ width: `${((currentStep + 1) / questions.length) * 100}%` }}></div>
                  </div>
                </div>
                <span className="bg-[#0a0d16] text-amber-200/70 px-4 py-1.5 rounded-sm border border-amber-900/50 text-[10px] tracking-widest shadow-inner">
                  {gender === 'female' ? '星月之徑 (女)' : '烈陽之徑 (男)'}
                </span>
              </div>

              <h3 className="text-xl md:text-2xl font-medium text-amber-50 mb-8 leading-relaxed tracking-wide drop-shadow-md" style={{ fontFamily: '"Noto Serif TC", serif' }}>
                {questions[currentStep].text}
              </h3>

              <div className="space-y-4 mb-10">
                {questions[currentStep].type === 'text' ? (
                  <textarea
                    className="w-full p-5 bg-[#090b14]/80 text-amber-100 border border-amber-900/50 rounded-lg focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500/50 transition-all resize-none placeholder-indigo-900/60 shadow-inner tracking-wide"
                    rows={questions[currentStep].id === 'comment' ? 4 : 1}
                    placeholder={questions[currentStep].placeholder}
                    value={answers[questions[currentStep].id] || ''}
                    onChange={(e) => handleTextChange(questions[currentStep].id, e.target.value)}
                    style={{ fontFamily: '"Noto Serif TC", serif' }}
                  />
                ) : (
                  questions[currentStep].options.map((opt, idx) => {
                    const isSelected = (answers[questions[currentStep].id] || []).includes(idx);
                    const isMulti = questions[currentStep].type === 'multi';
                    return (
                      <label
                        key={idx}
                        className={`flex items-start p-5 border rounded-lg cursor-pointer transition-all duration-500 group relative overflow-hidden ${
                          isSelected 
                          ? 'border-amber-500/80 bg-amber-900/20 shadow-[0_0_20px_rgba(245,158,11,0.1)]' 
                          : 'border-slate-800 bg-[#090b14]/50 hover:border-amber-700/50 hover:bg-[#0d111d]'
                        }`}
                      >
                        {isSelected && <div className="absolute inset-0 bg-gradient-to-r from-amber-600/10 to-transparent pointer-events-none"></div>}
                        <div className="relative flex-shrink-0 mt-0.5 z-10">
                          <input
                            type={isMulti ? "checkbox" : "radio"}
                            className="peer sr-only"
                            checked={isSelected}
                            onChange={() => handleOptionToggle(questions[currentStep].id, idx, isMulti)}
                          />
                          <div className={`w-5 h-5 flex items-center justify-center transition-all ${isSelected ? 'border-amber-400' : 'border-slate-600 group-hover:border-amber-700/70'} ${isMulti ? 'rounded-sm border' : 'rounded-full border'}`}>
                            {isSelected && (
                              <div className={`bg-amber-400 shadow-[0_0_5px_rgba(251,191,36,0.8)] ${isMulti ? 'w-3 h-3 rounded-[1px]' : 'w-2.5 h-2.5 rounded-full'}`}></div>
                            )}
                          </div>
                        </div>
                        <span className={`ml-4 leading-relaxed tracking-wide z-10 transition-colors duration-300 ${isSelected ? 'font-medium text-amber-100' : 'text-indigo-200/70 group-hover:text-amber-50/90'}`} style={{ fontFamily: '"Noto Serif TC", serif' }}>
                          {opt.text}
                        </span>
                      </label>
                    );
                  })
                )}
              </div>

              <div className="flex justify-between items-center pt-6 border-t border-amber-900/30">
                <button
                  onClick={handlePrev}
                  disabled={currentStep === 0}
                  className={`px-6 py-2 rounded-sm font-medium tracking-widest text-sm transition-all duration-300 ${
                    currentStep === 0 ? 'opacity-0 pointer-events-none' : 'text-slate-500 hover:text-amber-400'
                  }`}
                >
                  ← 回溯
                </button>
                <button
                  onClick={handleNext}
                  disabled={
                    questions[currentStep].type === 'text' && (questions[currentStep].id === 'name' || questions[currentStep].id === 'playTime')
                      ? !answers[questions[currentStep].id] || answers[questions[currentStep].id].trim() === ''
                      : questions[currentStep].type !== 'text' && (answers[questions[currentStep].id] || []).length === 0
                  }
                  className={`relative overflow-hidden px-8 py-2.5 rounded-sm font-bold tracking-[0.2em] transition-all duration-500 ${
                    (questions[currentStep].type === 'text' && (questions[currentStep].id === 'name' || questions[currentStep].id === 'playTime')) ? (!answers[questions[currentStep].id] || answers[questions[currentStep].id].trim() === '') : (questions[currentStep].type !== 'text' && (answers[questions[currentStep].id] || []).length === 0)
                    ? 'bg-[#0a0d16] border border-slate-800 text-slate-700 cursor-not-allowed' 
                    : 'bg-gradient-to-r from-amber-700 to-amber-600 border border-amber-500/50 text-amber-50 hover:from-amber-600 hover:to-amber-500 shadow-[0_0_15px_rgba(217,119,6,0.4)] hover:shadow-[0_0_25px_rgba(245,158,11,0.6)]'
                  }`}
                >
                  {currentStep === questions.length - 1 ? '揭曉宿命' : '下一張牌'}
                </button>
              </div>
            </div>
          )}

          {currentStep === questions.length && (() => {
            const finalResults = calculateResults();
            const topCharacter = finalResults[0];

            return (
              <div className="relative z-10 bg-[#0d111d]/90 backdrop-blur-2xl border border-amber-900/60 p-8 md:p-12 rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.9)] max-w-5xl w-full">
                <div className="absolute top-4 left-4 text-amber-600/50 text-xs">✦</div>
                <div className="absolute top-4 right-4 text-amber-600/50 text-xs">✦</div>
                <div className="absolute bottom-4 left-4 text-amber-600/50 text-xs">✦</div>
                <div className="absolute bottom-4 right-4 text-amber-600/50 text-xs">✦</div>

                <h2 className="text-xs font-bold text-center tracking-[0.4em] text-amber-600/80 mb-3 uppercase">The Judgement</h2>
                <h3 className="text-3xl md:text-4xl font-black text-center text-amber-100 mb-10 tracking-[0.2em] drop-shadow-md" style={{ fontFamily: '"Noto Serif TC", serif' }}>命運的指引</h3>
                
                <div className="relative overflow-hidden bg-[#090b14] p-8 rounded-lg border border-amber-700/50 mb-12 text-center group shadow-[inset_0_0_40px_rgba(0,0,0,0.8)]">
                  <div className="absolute top-0 left-0 w-full h-0.5 bg-gradient-to-r from-transparent via-amber-500 to-transparent opacity-60"></div>
                  <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-10 pointer-events-none"></div>
                  
                  <div className="mb-4 text-amber-600 text-xl">✧</div>
                  <p className="text-indigo-200/60 mb-2 tracking-widest text-xs uppercase">與您靈魂共鳴的阿卡納</p>
                  <h4 className="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-amber-100 via-amber-300 to-amber-600 mb-6 drop-shadow-[0_2px_10px_rgba(217,119,6,0.3)] tracking-[0.15em]" style={{ fontFamily: '"Noto Serif TC", serif' }}>
                    {topCharacter.name}
                  </h4>
                  <p className="text-sm text-indigo-100/50 max-w-md mx-auto leading-loose tracking-wide font-light">
                    星辰交匯之處，此角色與您的靈魂最為契合。<br/>在理想國的迷霧中，你們將譜寫出最真實的篇章。
                  </p>
                  <div className="mt-6 text-amber-600 text-xl">✧</div>
                </div>

                <div className="flex items-center gap-4 mb-10 opacity-80">
                  <div className="h-px flex-1 bg-gradient-to-r from-transparent to-amber-900/60"></div>
                  <h4 className="text-xs font-bold tracking-[0.3em] text-amber-500/80 uppercase">Arcana Cards</h4>
                  <div className="h-px flex-1 bg-gradient-to-l from-transparent to-amber-900/60"></div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                  {finalResults.map((char, index) => (
                    <div key={char.name} className={`relative flex flex-col items-center p-4 rounded-md border transition-all duration-700 ${index === 0 ? 'bg-[#0a0d16] border-amber-500/60 shadow-[0_0_30px_rgba(217,119,6,0.15)] transform md:-translate-y-3' : 'bg-[#07090f]/80 border-slate-800/80 hover:border-amber-900/50'}`}>
                      
                      <div className="relative w-full aspect-[2/3] mb-5 overflow-hidden rounded-sm bg-[#05060a] border-2 border-[#1a2035] group shadow-inner p-1">
                        <div className="w-full h-full relative overflow-hidden rounded-[2px] border border-slate-800/50">
                          <img
                            src={characterImages[char.name]}
                            alt={char.name}
                            className="object-cover w-full h-full opacity-85 group-hover:opacity-100 group-hover:scale-105 transition-all duration-1000 ease-out"
                            onError={(e) => { e.target.src = `https://placehold.co/400x600/0f172a/fcd34d?font=playfair-display&text=${encodeURIComponent(char.name)}` }}
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                        </div>
                        
                        <div className={`absolute top-4 left-1/2 -translate-x-1/2 font-serif text-lg font-bold drop-shadow-md ${index === 0 ? 'text-amber-400' : 'text-slate-400'}`}>
                          {index === 0 ? 'I' : index === 1 ? 'II' : 'III'}
                        </div>
                      </div>

                      <span className="text-2xl font-bold text-amber-50 mb-5 tracking-widest drop-shadow-sm" style={{ fontFamily: '"Noto Serif TC", serif' }}>{char.name}</span>
                      
                      <div className="flex w-full gap-2 text-xs tracking-wider">
                        <div className="flex-1 flex flex-col items-center justify-center py-2.5 bg-[#05060a] border border-slate-800 rounded-sm">
                          <span className="text-slate-500 mb-1 text-[10px]">共鳴</span>
                          <span className="text-amber-400 font-bold">{char.positive}</span>
                        </div>
                        <div className="flex-1 flex flex-col items-center justify-center py-2.5 bg-[#05060a] border border-slate-800 rounded-sm">
                          <span className="text-slate-500 mb-1 text-[10px]">背離</span>
                          <span className="text-slate-300 font-bold">{char.negative}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="mt-6 p-8 bg-[#090b14]/60 border border-amber-900/30 rounded-lg text-center relative overflow-hidden shadow-inner">
                  <div className="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-px bg-gradient-to-r from-transparent via-amber-700/50 to-transparent"></div>
                  
                  <h4 className="text-sm font-bold text-amber-200/90 mb-2 tracking-[0.2em]" style={{ fontFamily: '"Noto Serif TC", serif' }}>締結契約 (通知 GM)</h4>
                  <p className="text-xs text-indigo-200/50 mb-6 tracking-wide">將您的靈魂印記交予守護者，開啟命運的篇章。</p>
                  
                  <button
                    onClick={handleSubmitToSheet}
                    disabled={submitStatus === 'loading' || submitStatus === 'success'}
                    className={`relative overflow-hidden px-10 py-3 rounded-sm font-bold tracking-[0.2em] text-sm transition-all duration-500 flex items-center justify-center mx-auto min-w-[220px] ${
                      submitStatus === 'success' ? 'bg-[#0a0d16] text-amber-500 border border-amber-700/80 shadow-[0_0_15px_rgba(217,119,6,0.2)]' :
                      submitStatus === 'loading' ? 'bg-[#05060a] text-slate-600 cursor-not-allowed border border-slate-800' :
                      'bg-gradient-to-b from-amber-800/80 to-[#0a0d16] text-amber-100 hover:from-amber-700 hover:to-[#0a0d16] border border-amber-600/50 hover:border-amber-400 shadow-[0_0_10px_rgba(0,0,0,0.5)] hover:shadow-[0_0_20px_rgba(217,119,6,0.3)]'
                    }`}
                  >
                    {submitStatus === 'loading' && '星象傳遞中...'}
                    {submitStatus === 'success' && '✦ 契約已結 ✦'}
                    {submitStatus === 'error' && '傳遞失敗，請重試'}
                    {(submitStatus === 'idle') && '傳送命運軌跡'}
                  </button>
                </div>

                <div className="flex justify-center mt-12">
                  <button
                    onClick={resetTest}
                    className="text-slate-500 hover:text-amber-400 text-xs font-medium tracking-[0.2em] transition-colors duration-500 border-b border-transparent hover:border-amber-400/30 pb-1 uppercase"
                  >
                    重啟命運之輪
                  </button>
                </div>
              </div>
            );
          })()}
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
